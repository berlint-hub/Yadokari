name: Switch Nightly Build (NRO)
# Builds the Nintendo Switch homebrew .nro (armsx2nx.nro) with devkitPro + NXVK.
# On berlint-hub/Yadokari the NRO is also published to the ci-artifacts-switch branch
# and as a GitHub release, so it can be downloaded via github.com/codeload (no Azure blob needed).

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 300

    outputs:
      nro_path: ${{ steps.locate.outputs.NRO_PATH }}

    steps:
      - name: Checkout of code
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config bison flex python3 ccache wget curl unzip ca-certificates

      - name: Install devkitPro pacman + switch-dev
        run: |
          DEB_URL=$(curl -s https://api.github.com/repos/devkitPro/pacman/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*amd64\.deb"' | cut -d '"' -f 4 | head -n 1)
          echo "pacman deb: $DEB_URL"
          wget -q "$DEB_URL" -O /tmp/dkp-pacman.deb
          sudo apt-get install -y /tmp/dkp-pacman.deb
          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "/opt/devkitpro/pacman/bin" >> "$GITHUB_PATH"
          echo "/opt/devkitpro/tools/bin" >> "$GITHUB_PATH"
          sudo dkp-pacman-key --init || true
          sudo dkp-pacman-key --populate || true
          sudo dkp-pacman -Syu --noconfirm
          sudo dkp-pacman -S --noconfirm switch-dev switch-libpng switch-libjpeg-turbo switch-ntfs-3g switch-lwext4
          ls /opt/devkitpro/cmake/Switch.cmake

      - name: Clone uam sources (UAM_ROOT)
        run: |
          git clone --depth 1 https://github.com/devkitPro/uam "$GITHUB_WORKSPACE/uam"
          echo "UAM_ROOT=$GITHUB_WORKSPACE/uam" >> "$GITHUB_ENV"

      - name: Ensure uam host tool in DEVKITPRO/tools/bin
        run: |
          export DEVKITPRO=/opt/devkitpro
          if [ -x "$DEVKITPRO/tools/bin/uam" ]; then
            echo "uam already shipped with switch-dev"
            exit 0
          fi
          echo "uam missing, building from source"
          cmake -S "$UAM_ROOT" -B "$GITHUB_WORKSPACE/uam-host-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$GITHUB_WORKSPACE/uam-host-build" -j"$(nproc)"
          UAM_BIN=$(find "$GITHUB_WORKSPACE/uam-host-build" -type f -name uam -executable | head -n 1)
          echo "built: $UAM_BIN"
          sudo cp "$UAM_BIN" "$DEVKITPRO/tools/bin/uam"
          "$DEVKITPRO/tools/bin/uam" --help 2>&1 | head -3 || true

      - name: Build and install NXVK (Vulkan portlib)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH="/opt/devkitpro/pacman/bin:/opt/devkitpro/tools/bin:$PATH"
          git clone --depth 1 https://github.com/PalindromicBreadLoaf/nxvk "$GITHUB_WORKSPACE/nxvk"
          cd "$GITHUB_WORKSPACE/nxvk"
          make -j"$(nproc)"
          sudo make install
          echo "--- nxvk pkg-config files ---"
          ls "/opt/devkitpro/portlibs/switch/lib/pkgconfig/" | grep -i nxvk || true
          pkg-config --modversion nxvk || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: switch-nro-ccache-${{ github.sha }}
          restore-keys: |
            switch-nro-ccache-

      - name: Configure Switch core
        run: |
          export DEVKITPRO=/opt/devkitpro
          cmake -S app/src/main/cpp -B build/switch-core \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DUSE_OPENGL=OFF \
            -DUSE_VULKAN=ON \
            -DUAM_ROOT="$UAM_ROOT"

      - name: Build armsx2_nro
        run: |
          export DEVKITPRO=/opt/devkitpro
          mkdir -p build/switch-core
          cmake --build build/switch-core --target armsx2_nro -j"$(nproc)" 2>&1 | tee build/switch-core/build.log
          exit "${PIPESTATUS[0]}"

      - name: Locate NRO
        id: locate
        run: |
          NRO=$(find build/switch-core -type f -name '*.nro' -print -quit)
          if [ -z "$NRO" ]; then
            echo "CRITICAL ERROR: .nro not found"
            exit 1
          fi
          echo "NRO_PATH=$NRO" >> "$GITHUB_OUTPUT"
          cp "$NRO" armsx2nx.nro
          ls -la armsx2nx.nro
          head -c 4 armsx2nx.nro | xxd | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: armsx2nx-nro
          path: armsx2nx.nro

      - name: Push build log to ci-artifacts-switch (on failure, for debugging)
        if: failure() && github.repository == 'berlint-hub/Yadokari'
        run: |
          set -e
          git config user.email "actions-ci@localhost"
          git config user.name "actions-ci"
          mkdir -p logs
          [ -f build/switch-core/build.log ] && cp build/switch-core/build.log "logs/build-run-${{ github.run_id }}.log" || echo "no build log" > "logs/build-run-${{ github.run_id }}.log"
          if git ls-remote --exit-code origin ci-artifacts-switch >/dev/null 2>&1; then
            git fetch origin ci-artifacts-switch
            git checkout ci-artifacts-switch
            git add logs
            git commit -m "build log run ${{ github.run_id }}" || true
            git push origin ci-artifacts-switch
          else
            git checkout --orphan ci-artifacts-switch
            git rm -rf --quiet .
            git add logs
            git commit -m "build log run ${{ github.run_id }}"
            git push --force origin HEAD:ci-artifacts-switch
          fi

  publish:
    permissions:
      contents: write
      actions: read
    needs: [ build ]
    if: github.repository == 'berlint-hub/Yadokari'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout of code
        uses: actions/checkout@v5

      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: armsx2nx-nro
          path: artifact

      - name: Push NRO to ci-artifacts-switch branch (direct git/codeload download)
        run: |
          set -e
          NRO_FILE=$(find artifact -type f -name '*.nro' -print -quit)
          if [ -z "$NRO_FILE" ]; then
            echo "CRITICAL ERROR: nro not found in artifact."
            exit 1
          fi
          git config user.email "actions-ci@localhost"
          git config user.name "actions-ci"
          mkdir -p artifacts
          cp "$NRO_FILE" artifacts/armsx2nx.nro
          printf 'run_id=%s\nsha=%s\nhead_ref=%s\nworkflow=Switch Nightly Build (NRO)\nrun_url=%s\n' \
            "${{ github.run_id }}" "${{ github.sha }}" "${{ github.head_ref }}" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > artifacts/build-info.txt
          if git ls-remote --exit-code origin ci-artifacts-switch >/dev/null 2>&1; then
            git fetch origin ci-artifacts-switch
            git checkout ci-artifacts-switch
            git add artifacts
            git commit -m "armsx2nx.nro from run ${{ github.run_id }}"
            git push origin ci-artifacts-switch
          else
            git checkout --orphan ci-artifacts-switch
            git rm -rf --quiet .
            git add artifacts
            git commit -m "armsx2nx.nro from run ${{ github.run_id }}"
            git push --force origin HEAD:ci-artifacts-switch
          fi
          echo "Pushed NRO to ci-artifacts-switch branch"

  release:
    permissions:
      contents: write
    needs: [ build ]
    continue-on-error: ${{ github.repository == 'berlint-hub/Yadokari' }}
    if: >
      github.repository == 'berlint-hub/Yadokari' ||
      (github.repository == 'ARMSX2/ARMSX2' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: armsx2nx-nro
          path: artifact

      - name: Create the Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: switch-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          name: Switch Nightly Build (NRO) - run ${{ github.run_id }}
          body: |
            ## Automatic Switch Nightly Release (DEBUG)

            Automated build of the Nintendo Switch homebrew **.nro** for community testing.

            * **Branch:** ${{ github.ref_name }}
            * **Commit:** ${{ github.sha }}
            * **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            **Download `armsx2nx.nro` from the assets below** and place it on your Switch's SD card.
            You still need a BIOS dump from a legitimately-owned PS2 console.
          draft: false
          prerelease: true
          files: artifact/*.nro
